name: Standard CI Pipeline

# Định nghĩa khi nào CI sẽ chạy
on:
  push:
    branches: [ "dev" ] # Chạy khi có code đẩy trực tiếp lên nhánh dev
  pull_request:
    branches: [ "dev" ] # Chạy khi có một Pull Request yêu cầu merge vào nhánh dev

jobs:
  # Job kiểm tra code và chạy test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest # Chạy trên máy ảo Ubuntu mới nhất của GitHub

    steps:
    # Bước 1: Lấy source code từ repository
    - name: 📥 Checkout Source Code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt môi trường Java 23
    - name: ☕ Setup Java (JDK 23)
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: 'maven' # Cache thư viện Maven giúp các lần chạy sau nhanh hơn

    # Bước 3: Cấp quyền thực thi cho file mvnw
    - name: 🔑 Grant execute permission for mvnw
      run: chmod +x mvnw

    # Bước 4: Kiểm tra xem code có thể compile thành công không
    - name: ⚙️ Compile Code
      run: ./mvnw -B clean compile

    # Bước 5: Chạy các bài Test (Unit Test, Integration Test)
    - name: 🧪 Run Tests
      run: ./mvnw -B test

    # Bước 6: Đóng gói và kiểm tra các chuẩn mực khác (nếu có)
    - name: 📦 Verify & Package
      run: ./mvnw -B verify -DskipTests
