name: Standard CI Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java (JDK 23)
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    - name: Compile Code
      run: ./mvnw -B clean compile

    - name: Run Tests
      run: ./mvnw -B test

#    - name: 📦 Verify & Package
#      run: ./mvnw -B verify -DskipTests
